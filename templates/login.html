<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendly | Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="login-wrapper">
    <div class="login-card">
      <h1>Attendly</h1>
      <p class="muted">Sign in to manage attendance</p>
      <form method="post" class="form" style="margin-top: 18px">
        <div class="field">
          <label>Email / Username</label>
          <input type="text" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
        <p class="muted" style="text-align: center; margin-top: 8px">
          New here?
          <a href="#">Create an account</a>
        </p>
      </form>
    </div>
  </body>
</html>
