<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>self attence</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      @media (max-width: 768px) {
        .layout {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
          padding: 10px;
          gap: 10px;
        }
        .sidebar .logo {
          width: 100%;
        }
        .sidebar .nav-title {
          width: 100%;
        }
        .sidebar .nav {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
          gap: 5px;
        }
        .sidebar .nav a {
          flex: 1;
          min-width: 70px;
          padding: 8px 5px;
          font-size: 12px;
          text-align: center;
        }
        .sidebar .nav a span {
          display: block;
        }
        .content {
          width: 100%;
        }
      }
      @media (max-width: 480px) {
        .sidebar .nav a {
          min-width: 50px;
          padding: 6px 3px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">self attence</div>
      <div class="user-info">
        {% if is_admin and student_users %}
        <select id="userSelector" onchange="changeUser()" style="margin-right: 15px; padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;">
          <option value="">Select User...</option>
          {% for su in student_users %}
          <option value="{{ su.id }}">{{ su.name }} ({{ su.id }})</option>
          {% endfor %}
        </select>
        <span style="margin-right: 10px; color: #d32f2f; font-weight: bold;"><i class="fa-solid fa-shield-halved"></i> Admin</span>
        {% endif %}
        <i class="fa-regular fa-user"></i>
        <span>{{ user or 'Guest' }}</span>
        <a class="btn-secondary btn-small" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
    <script>
      function changeUser() {
        const select = document.getElementById('userSelector');
        const userId = select.value;
        if (userId) {
          const currentUrl = window.location.href;
          const url = new URL(currentUrl);
          url.searchParams.set('user_id', userId);
          window.location.href = url.toString();
        }
      }
      // Set selected user in dropdown on page load
      window.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const selectedUserId = urlParams.get('user_id');
        const select = document.getElementById('userSelector');
        if (select && selectedUserId) {
          select.value = selectedUserId;
        }
      });
    </script>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">self attence</div>
        <div class="nav-title">Menu</div>
        <nav class="nav">
          <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a>
          <a href="{{ url_for('students_page') }}"><i class="fa-solid fa-user-graduate"></i> <span>Students</span></a>
          <a href="{{ url_for('attendance') }}"><i class="fa-solid fa-clipboard-check"></i> <span>Attendance</span></a>
          <a href="{{ url_for('reports') }}"><i class="fa-solid fa-file-lines"></i> <span>Reports</span></a>
        </nav>
      </aside>
      <main class="content">
        <section class="page-content">
          {% block content %}{% endblock %}
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
