<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendly</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Attendly</div>
      <div class="user-info">
        <i class="fa-regular fa-user"></i>
        <span>{{ user or 'Guest' }}</span>
        <a class="btn-secondary btn-small" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">Attendly</div>
        <div class="nav-title">Menu</div>
        <nav class="nav">
          <a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a>
          <a href="{{ url_for('students_page') }}"><i class="fa-solid fa-user-graduate"></i> <span>Students</span></a>
          <a href="{{ url_for('attendance') }}"><i class="fa-solid fa-clipboard-check"></i> <span>Attendance</span></a>
          <a href="{{ url_for('reports') }}"><i class="fa-solid fa-file-lines"></i> <span>Reports</span></a>
        </nav>
      </aside>
      <main class="content">
        <section class="page-content">
          {% block content %}{% endblock %}
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
